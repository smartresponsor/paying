parameters:
    payment.idem_ttl_default: 86400
    paying.messenger.dsn: '%env(resolve:RABBITMQ_DSN)%'
    paying.storage.data_server_version: '16.0'
    paying.storage.infra_server_version: '3.45.1'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Paying\ServiceInterface\EventMapperInterface:
            tags: [ 'payment.event_mapper' ]

    App\Paying\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/**/Resources/'
            - '../src/**/Tests/'

    App\Paying\RepositoryInterface\PaymentRepositoryInterface: '@App\Paying\Repository\PaymentRepository'
    App\Paying\InfrastructureInterface\PaymentProjectionRepositoryInterface: '@App\Paying\Infrastructure\PaymentProjectionRepository'
    App\Paying\ServiceInterface\ProviderRouterInterface: '@App\Paying\Service\ProviderRouter'
    App\Paying\ServiceInterface\ProviderGuardInterface: '@App\Paying\Service\ProviderGuard'
    App\Paying\ServiceInterface\PaymentServiceInterface: '@App\Paying\Service\PaymentService'
    App\Paying\ServiceInterface\IdempotencyStoreInterface:
        factory: [ '@App\Paying\Service\IdempotencyStoreFactory', 'create' ]

    App\Paying\Controller\:
        resource: '../src/Controller/'
        public: true
        tags: [ 'controller.service_arguments' ]

    App\Paying\Service\ProviderRouter:
        arguments:
            $providers:
                internal: '@App\Paying\Service\InternalPaymentProvider'
                stripe: '@App\Paying\Service\StripePaymentProvider'
                paypal: '@App\Paying\Service\PayPalPaymentProvider'

    App\Paying\Service\StripePaymentProvider:
        arguments:
            $secretKey: '%env(default::STRIPE_SECRET_KEY)%'
            $webhookSecret: '%env(default::STRIPE_WEBHOOK_SECRET)%'

    App\Paying\ServiceInterface\IdempotencyServiceInterface: '@App\Paying\Service\IdempotencyService'

    App\Paying\Service\IdempotencyService:
        arguments:
            $ttlSec: '%env(int:default:payment.idem_ttl_default:IDEM_TTL)%'

    App\Paying\Infrastructure\PaymentProjectionRepository:
        arguments:
            $infra: '@doctrine.dbal.infra_connection'

    App\Paying\Infrastructure\RateLimitSubscriber:
        arguments:
            $paymentApiLimiter: '@limiter.payment_api'

    App\Paying\ServiceInterface\DlqServiceInterface: '@App\Paying\Service\DlqService'
    App\Paying\ServiceInterface\ProjectionLagServiceInterface: '@App\Paying\Service\ProjectionLagService'
    App\Paying\ServiceInterface\MetricInterface: '@App\Paying\Service\Metric'
    App\Paying\ServiceInterface\PaymentStartServiceInterface: '@App\Paying\Service\PaymentStartService'
    App\Paying\ServiceInterface\PaymentApiStartHandlerInterface: '@App\Paying\Service\PaymentApiStartHandler'
    App\Paying\ServiceInterface\PaymentConsoleReadModelInterface: '@App\Paying\Service\PaymentConsoleReadModel'
    App\Paying\ServiceInterface\PaymentConsoleCreateHandlerInterface: '@App\Paying\Service\PaymentConsoleCreateHandler'
    App\Paying\ServiceInterface\PaymentConsoleStartHandlerInterface: '@App\Paying\Service\PaymentConsoleStartHandler'
    App\Paying\ServiceInterface\PaymentConsoleFinalizeHandlerInterface: '@App\Paying\Service\PaymentConsoleFinalizeHandler'
    App\Paying\ServiceInterface\PaymentConsoleRefundHandlerInterface: '@App\Paying\Service\PaymentConsoleRefundHandler'
    App\Paying\ServiceInterface\WebhookIngestServiceInterface: '@App\Paying\Service\WebhookIngestService'

    App\Paying\ServiceInterface\WebhookVerifierInterface: '@App\Paying\Service\WebhookVerifier'
    App\Paying\ServiceInterface\TokenVerifierInterface: '@App\Paying\Service\TokenVerifier'
    App\Paying\ServiceInterface\OidcJwksCacheInterface: '@App\Paying\Service\OidcJwksCache'
    App\Paying\ServiceInterface\ValidationErrorMapperInterface: '@App\Paying\Service\ValidationErrorMapper'
    App\Paying\ServiceInterface\ApiErrorResponseFactoryInterface: '@App\Paying\Service\ApiErrorResponseFactory'
    App\Paying\ServiceInterface\ApiJsonBodyDecoderInterface: '@App\Paying\Service\ApiJsonBodyDecoder'
    App\Paying\ServiceInterface\ApiRequestValidatorInterface: '@App\Paying\Service\ApiRequestValidator'

    App\Paying\ServiceInterface\ProjectionSyncInterface: '@App\Paying\Service\ProjectionSync'
    App\Paying\ServiceInterface\RefundServiceInterface: '@App\Paying\Service\RefundService'
    App\Paying\ServiceInterface\ReconciliationServiceInterface: '@App\Paying\Service\ReconciliationService'
    App\Paying\InfrastructureInterface\OutboxPublisherInterface: '@App\Paying\Infrastructure\OutboxPublisher'

    App\Paying\Controller\WebhookController:
        public: true
        tags: [ 'controller.service_arguments' ]
        arguments:
            $mappers: !tagged_iterator payment.event_mapper

    payment_audit.logger:
        alias: monolog.logger.payment_audit

    App\Paying\Controller\Webhook\StripeWebhookController:
        public: true
        tags: [ 'controller.service_arguments' ]
        arguments:
            $paymentAuditLogger: '@payment_audit.logger'

    App\Paying\Controller\Webhook\PayPalWebhookController:
        public: true
        tags: [ 'controller.service_arguments' ]
        arguments:
            $paymentAuditLogger: '@payment_audit.logger'

    App\Paying\ServiceInterface\Outbox\PaymentOutboxProcessorInterface: '@App\Paying\Service\Outbox\PaymentOutboxProcessor'

    App\Paying\Service\Outbox\PaymentOutboxProcessor:
        arguments:
            $em: '@doctrine.orm.entity_manager'
            $transport: '@messenger.transport.payment_outbox'
            $logger: '@logger'

    App\Paying\Service\Order\NullOrderPaymentSync:
        arguments:
            $logger: '@logger'
        autoconfigure: true
        autowire: true

    App\Paying\ServiceInterface\Order\OrderPaymentSyncInterface: '@App\Paying\Service\Order\NullOrderPaymentSync'

    App\Paying\ServiceInterface\Reconciliation\PaymentReconciliationServiceInterface: '@App\Paying\Service\Reconciliation\PaymentReconciliationService'
