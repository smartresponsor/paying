openapi: 3.0.3
info:
  title: Payment API
  version: 1.0.0
  description: Canonical external HTTP contract for the Paying component.
servers:
  - url: /
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Payment:
      type: object
      required: [id, status, amount, currency]
      properties:
        id:
          type: string
          description: ULID payment identifier
        status:
          type: string
        amount:
          type: string
          example: "12.50"
        currency:
          type: string
          example: USD
        providerRef:
          type: string
          nullable: true
    StartPaymentRequest:
      type: object
      required: [amount, currency, provider]
      properties:
        amount:
          type: string
          example: "12.50"
        currency:
          type: string
          example: USD
        provider:
          type: string
          enum: [internal, stripe, paypal]
    CreatePaymentRequest:
      type: object
      required: [orderId, amountMinor, currency]
      properties:
        orderId:
          type: string
        amountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
    RefundPaymentRequest:
      type: object
      required: [amount, provider]
      properties:
        amount:
          type: string
          example: "10.00"
        provider:
          type: string
          enum: [internal, stripe, paypal]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
paths:
  /api/payment/doc/json:
    get:
      summary: Read the machine-readable OpenAPI document
      security: []
      responses:
        '200':
          description: OpenAPI document
  /api/payment/doc:
    get:
      summary: Open the Swagger UI for the Payment API
      security: []
      responses:
        '200':
          description: Swagger UI
  /api/payments:
    post:
      summary: Create payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/payments/start:
    post:
      summary: Start provider payment flow
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPaymentRequest'
      responses:
        '200':
          description: Payment flow started
        '400':
          description: Invalid request
  /api/payments/{id}:
    get:
      summary: Read payment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
  /api/payments/refund/{id}:
    post:
      summary: Refund payment through the canonical plural API route
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
      responses:
        '200':
          description: Payment refunded
        '404':
          description: Payment not found
  /api/payment/refund/{id}:
    post:
      summary: Refund payment through the compatibility singular API route
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
      responses:
        '200':
          description: Payment refunded
        '404':
          description: Payment not found
  /api/payment/metric:
    get:
      summary: Read payment metrics
      responses:
        '200':
          description: Payment metrics snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
