services:
    _defaults:
        bind:
            $secretKey: '%paying.provider.stripe_secret_key%'
            $webhookSecret: '%paying.provider.stripe_webhook_secret%'
            $ttlSec: '%paying.idempotency.ttl_sec%'
            $redisUrl: '%paying.idempotency.redis_url%'
            $cacheDir: '%kernel.cache_dir%'
            $ttl: '%paying.oidc.jwks_ttl%'
            $jwksUrl: '%paying.oidc.jwks_url%'
            $issuer: '%paying.oidc.issuer%'
            $audience: '%paying.oidc.audience%'
            $oidcDisabled: '%paying.oidc.disabled%'
            $adyenHmacSecret: '%paying.webhook.adyen_hmac_secret%'
            $allowUnknown: '%paying.webhook.allow_unknown%'
            $paymentSuccessUrl: '%paying.provider.payment_success_url%'
            $paymentCancelUrl: '%paying.provider.payment_cancel_url%'
