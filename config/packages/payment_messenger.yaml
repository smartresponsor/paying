framework:
  messenger:
    transports:
      payment_outbox:
        dsn: '%paying.messenger.dsn%'
        options:
          exchange:
            name: 'payment.events'
            type: 'topic'
          queues:
            payment_outbox:
              binding_keys: [ 'payment.*' ]
      payment_outbox_failed:
        dsn: '%paying.messenger.dsn%'
        options:
          exchange:
            name: 'payment.events.dlq'
            type: 'fanout'
          queues: { payment_outbox_failed: ~ }

    failure_transport: payment_outbox_failed
