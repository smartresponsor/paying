doctrine:
  dbal:
    default_connection: data
    connections:
      data:
        # User data storage; PostgreSQL in normal runtime, SQLite in test override.
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '%paying.storage.data_server_version%'
      infra:
        # Application/infrastructure data storage; SQLite in all runtimes.
        url: '%env(resolve:INFRA_URL)%'
        server_version: '%paying.storage.infra_server_version%'
  orm:
    entity_managers:
      default:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        connection: data
        mappings:
          App:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Entity'
            prefix: 'App\Entity'
            alias: App
