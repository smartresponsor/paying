imports:
    - { resource: 'services/payment_aliases.yaml' }

parameters:
    payment.idem_ttl_default: 86400
    payment.http_content_security_policy: "default-src 'self'; style-src 'self' 'unsafe-inline'"
    payment.oidc_jwks_cache_dir: '%kernel.project_dir%/var/cache/payment'
    payment.oidc_jwks_cache_ttl: 3600
    paying.messenger.dsn: '%env(resolve:RABBITMQ_DSN)%'
    paying.storage.data_server_version: '16.0'
    paying.storage.infra_server_version: '3.45.1'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Paying\ServiceInterface\PaymentEventMapperInterface:
            tags: [ 'payment.event_mapper' ]

    App\Paying\:
        resource: '../src/'
        exclude:
            - '../src/Attribute/'
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Normalizer/PaymentListingPricingProfileNormalizer.php'
            - '../src/Kernel.php'
            - '../src/**/Resources/'
            - '../src/**/Tests/'

    App\Paying\ServiceInterface\PaymentIdempotencyStoreInterface:
        factory: [ '@App\Paying\Factory\PaymentIdempotencyStoreFactory', 'create' ]

    App\Paying\Builder\PaymentConsoleSurfaceBuilder:
        public: true

    App\Paying\Builder\PaymentApiSurfaceBuilder:
        public: true

    App\Paying\Builder\PaymentOpsSurfaceBuilder:
        public: true

    App\Paying\Controller\PaymentCreateController:
        public: true
        tags: [ 'controller.service_arguments' ]

    App\Paying\Controller\PaymentReadController:
        public: true
        tags: [ 'controller.service_arguments' ]

    App\Paying\Controller\PaymentFinalizeController:
        public: true
        tags: [ 'controller.service_arguments' ]

    App\Paying\Controller\PaymentStartController:
        public: true
        tags: [ 'controller.service_arguments' ]

    App\Paying\Controller\PaymentRefundController:
        public: true
        tags: [ 'controller.service_arguments' ]

    App\Paying\Controller\PaymentWebhookController:
        public: true
        tags: [ 'controller.service_arguments' ]
        arguments:
            $mappers: !tagged_iterator payment.event_mapper

    App\Paying\Controller\Webhook\PaymentStripeWebhookController:
        public: true
        tags: [ 'controller.service_arguments' ]
        arguments:
            $paymentAuditLogger: '@payment_audit.logger'

    App\Paying\Controller\Webhook\PaymentPayPalWebhookController:
        public: true
        tags: [ 'controller.service_arguments' ]
        arguments:
            $paymentAuditLogger: '@payment_audit.logger'

    App\Paying\Service\PaymentProviderRouter:
        arguments:
            $providers:
                internal: '@App\Paying\Provider\PaymentInternalProvider'
                stripe: '@App\Paying\Provider\PaymentStripeProvider'
                paypal: '@App\Paying\Provider\PaymentPayPalProvider'

    App\Paying\Service\PaymentProviderVocabularyService:
        arguments:
            $catalogVocabulary: '@?App\Cataloging\ServiceInterface\CatalogCategoryVocabularyServiceInterface'

    App\Paying\Service\PaymentMethodVocabularyService:
        arguments:
            $catalogVocabulary: '@?App\Cataloging\ServiceInterface\CatalogCategoryTypeVocabularyServiceInterface'

    App\Paying\Provider\PaymentStripeProvider:
        arguments:
            $secretKey: '%env(default::STRIPE_SECRET_KEY)%'
            $webhookSecret: '%env(default::STRIPE_WEBHOOK_SECRET)%'


    App\Paying\Service\PaymentIdempotencyService:
        arguments:
            $ttlSec: '%env(int:default:payment.idem_ttl_default:IDEM_TTL)%'

    App\Paying\Repository\PaymentRepository:
        arguments:
            $em: '@doctrine.orm.entity_manager'

    App\Paying\Repository\PaymentProjectionRepository:
        arguments:
            $infrastructure: '@doctrine.orm.infrastructure_entity_manager'

    App\Paying\Service\PaymentProjectionSyncService:
        arguments:
            $payments: '@App\Paying\Repository\PaymentRepository'
            $paymentProjectionRepository: '@App\Paying\Repository\PaymentProjectionRepository'

    App\Paying\Service\PaymentProjectionLagService:
        arguments:
            $payments: '@App\Paying\Repository\PaymentRepository'
            $paymentProjectionRepository: '@App\Paying\Repository\PaymentProjectionRepository'

    App\Paying\Service\PaymentSlaReporterService:
        arguments:
            $payments: '@App\Paying\Repository\PaymentRepository'

    App\Paying\Repository\PaymentOperationalRepository:
        arguments:
            $infrastructure: '@doctrine.orm.infrastructure_entity_manager'

    App\Paying\Repository\PaymentOutboxRepository:
        arguments:
            $em: '@doctrine.orm.entity_manager'

    App\Paying\Repository\PaymentWebhookRepository:
        arguments:
            $em: '@doctrine.orm.entity_manager'

    App\Paying\Repository\PaymentReconciliationRepository:
        arguments:
            $em: '@doctrine.orm.entity_manager'

    App\Paying\EventSubscriber\PaymentRateLimitSubscriber:
        arguments:
            $paymentApiLimiter: '@limiter.payment_api'

    App\Paying\EventSubscriber\PaymentScopeGuardSubscriber:
        arguments:
            $oidcDisabled: '%env(bool:OIDC_DISABLED)%'

    App\Paying\Service\Webhook\PaymentGenericWebhookProcessor:
        public: true
        tags: [ 'controller.service_arguments' ]
        arguments:
            $mappers: !tagged_iterator payment.event_mapper

    payment_audit.logger:
        alias: monolog.logger.payment_audit

    App\Paying\Service\Webhook\PaymentStripeWebhookProcessor:
        public: true
        tags: [ 'controller.service_arguments' ]
        arguments:
            $paymentAuditLogger: '@payment_audit.logger'

    App\Paying\Service\Webhook\PaymentPayPalWebhookProcessor:
        public: true
        tags: [ 'controller.service_arguments' ]
        arguments:
            $paymentAuditLogger: '@payment_audit.logger'

    App\Paying\Service\Outbox\PaymentOutboxProcessor:
        arguments:
            $transport: '@messenger.transport.payment_outbox'
            $logger: '@logger'

    App\Paying\Service\Order\PaymentNullOrderPaymentSync:
        arguments:
            $logger: '@logger'
        autoconfigure: true
        autowire: true



    App\Paying\EventSubscriber\PaymentResponseHeaderSubscriber:
        arguments:
            $contentSecurityPolicy: '%payment.http_content_security_policy%'

    App\Paying\Service\PaymentOidcJwksCache:
        arguments:
            $cacheDir: '%payment.oidc_jwks_cache_dir%'
            $ttl: '%payment.oidc_jwks_cache_ttl%'
            $jwksUrl: '%env(default::OIDC_JWKS_URL)%'

    App\Paying\Verifier\PaymentTokenVerifier:
        arguments:
            $issuer: '%env(default::OIDC_ISSUER)%'
            $audience: '%env(default::OIDC_AUDIENCE)%'
