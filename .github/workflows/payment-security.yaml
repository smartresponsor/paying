name: PaymentEntity Security

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_sqlite, sqlite3, dom, xml
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction
      - name: Composer audit
        run: composer security:composer-audit
